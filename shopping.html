<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/appstanovi-v2-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="assets/icons/appstanovi-v2-180.png" />
  <title>AppStanovi – Smart Shopping</title>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><img src="assets/icons/appstanovi-v2-48.png" alt="AppStanovi" /></div>
      <div>
        <div class="title">AppStanovi</div>
        <div class="subtitle">Nabavka</div>
      </div>
    </div>

    <nav class="primaryNav" aria-label="Glavna navigacija">
      <a class="primaryNavItem " href="index.html">Pregled</a>
      <a class="primaryNavItem " href="income.html">Prihodi</a>
      <a class="primaryNavItem " href="expenses.html">Troškovi</a>
      <span class="primaryNavItem is-disabled" title="Rezervacije – u pripremi">Rezervacije</span>
      <a class="primaryNavItem is-active" href="shopping.html">Nabavka</a>
      <a class="primaryNavItem " href="more.html">Više</a>
    </nav>

    <div class="pageActions">
      <select id="groupSelect" class="btn mobilePrimaryAction" aria-label="Shopping lista"></select>
    </div>
  </header>

  <main class="container">
    <section class="card" style="margin-bottom:12px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <button class="btn secondary" data-filter="TO_BUY" id="filterToBuy">Za kupiti</button>
        <button class="btn secondary" data-filter="IN_STOCK" id="filterInStock">Na stanju</button>
        <button class="btn secondary" data-filter="ALL" id="filterAll">Sve</button>

        <div style="flex:1"></div>

        <input id="searchInput" class="input" placeholder="Pretraga..." style="max-width:260px;" />
      </div>
    </section>

    <section class="card" style="margin-bottom:12px;">
      <form id="addForm" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <input id="nameInput" class="input" placeholder="Novi artikal (npr. WC papir)" style="min-width:260px;" />
        <input id="qtyInput" class="input" type="number" min="1" step="1" placeholder="Količina (opcionalno)" style="width:170px;" />
        <input id="noteInput" class="input" placeholder="Napomena (opcionalno)" style="min-width:220px;" />
        <select id="statusInput" class="input">
          <option value="IN_STOCK">Na stanju</option>
          <option value="TO_BUY">Za kupiti</option>
        </select>
        <button class="btn" type="submit">Dodaj</button>
      </form>
      <div class="hint" style="margin-top:8px;">
        Klik na stavku: toggle status. Ikona 🗑 briše stavku.
      </div>
    </section>

    <section class="card">
      <div id="listRoot"></div>
    </section>
  </main>


  <div id="print-root"></div>

  <nav class="bottomNav" aria-label="Glavna navigacija">
    <a class="bottomNavItem" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg><span>Pregled</span></a>
    <a class="bottomNavItem" href="income.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4z"/><path d="M7 4h10v3"/><path d="M8 13h8"/><path d="M12 10v6"/></svg><span>Prihodi</span></a>
    <a class="bottomNavItem" href="expenses.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Troškovi</span></a>
    <span class="bottomNavItem is-disabled" aria-disabled="true" title="Rezervacije – u pripremi"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="m8 15 2 2 5-5"/></svg><span>Rezervac.</span></span>
    <a class="bottomNavItem is-active" href="shopping.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.2 9.2a2 2 0 0 0 2 1.5h7.9a2 2 0 0 0 1.9-1.4L21 8H7"/><circle cx="10" cy="19" r="1.3"/><circle cx="18" cy="19" r="1.3"/></svg><span>Nabavka</span></a>
    <a class="bottomNavItem" href="more.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Više</span></a>
  </nav>

  <script type="module" src="js/shopping/shopping.js"></script>
  <script type="module" src="js/app/more-menu.js"></script>
  <script type="module" src="js/pwa/pwa-client.js"></script>
</body>
</html>
