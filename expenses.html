<!doctype html>
<html lang="bs">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AppStanovi – Troškovi</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🏠</div>
      <div>
        <div class="title">AppStanovi</div>
        <div class="subtitle">Troškovi (detaljno)</div>
      </div>
    </div>
    <div class="actions">
      <button id="btnOpenExpenseModal" class="btn">+ Novi trošak</button>
      <a class="btn secondary" href="index.html">← Nazad</a>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <h3>Filter</h3>

      <div id="expCalendar"></div>

      <div class="field">
        <label>Apartman</label>
        <select id="expApt">
          <option value="ALL">Svi</option>
          <option value="A">A</option>
          <option value="Z">Z</option>
          <option value="N">N</option>
        </select>
      </div>

      <div class="field">
        <label>Kategorija</label>
        <select id="expCat"></select>
      </div>

      <div class="card" style="margin-bottom:12px;">
        <div class="row" style="gap:10px; align-items:center;">
          <div style="flex:1;">
            <label>Merge FROM</label>
            <select id="mergeFrom"></select>
          </div>
          <div style="flex:1;">
            <label>Merge TO</label>
            <select id="mergeTo"></select>
          </div>
          <button id="mergeSave" class="btn">Sačuvaj merge</button>
        </div>
        <small id="mergeMsg"></small>
      </div>

    </aside>

    <section class="content">
      <div id="expStatus" class="status">Učitavam…</div>

      <div class="card" id="yearBreakdown" style="display:none; margin-bottom:12px;">
        <div class="boxTitle" style="margin-bottom:8px;">Mjeseci (izabrana kategorija)</div>
        <div id="yearBreakdownTable"></div>
      </div>

      <div class="grid2">
        <div class="box">
          <div class="boxTitle">Troškovi po kategoriji</div>
          <div id="expByCat"></div>
        </div>

        <div class="box">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <div class="boxTitle">Lista troškova (stavke)</div>
            <button id="expListToggle" class="btn secondary" type="button">Sakrij</button>
          </div>

          <div id="expListWrap">
            <div id="expList"></div>
          </div>
        </div>

      </div>
    </section>
  </main>
  <!-- EXPENSE MODAL -->
  <div id="expModal" class="modal is-hidden" aria-hidden="true">
    <div class="modalBackdrop" data-close="1"></div>

    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="expModalTitle">
      <div class="modalHeader">
        <div>
          <div id="expModalTitle" class="modalTitle">Novi trošak</div>
          <div class="modalSub">Unos u BAM (automatski preračun u EUR)</div>
        </div>
        <button id="btnCloseExpenseModal" class="btn secondary" type="button">✕</button>
      </div>

      <div class="modalBody">

        <div class="field">
          <label>Iznos (BAM)</label>
          <input id="expAddAmountBam" type="number" step="0.01" min="0" placeholder="npr 45.00" />
        </div>

        <div class="field">
          <label>Kategorija</label>
          <div class="row" style="gap:8px;">
            <select id="expAddCategory" style="flex:1;"></select>
            <button id="btnAddCategory" class="btn secondary" type="button">+ Kategorija</button>
          </div>
        </div>

        <div class="field">
          <label>Scope</label>
          <select id="expAddScope">
            <option value="SHARED">Shared (A+Z)</option>
            <option value="APARTMENT">Apartman</option>
          </select>
        </div>

        <div class="field" id="expAptWrap">
          <label>Apartman</label>
          <select id="expAddApt">
            <option value="A">A</option>
            <option value="Z">Z</option>
            <option value="N">N</option>
          </select>
        </div>

        <div class="field">
          <label>Datum (opciono)</label>
          <input id="expAddDate" type="date" />
          <small class="note">Ako ne uneseš datum, period se uzima iz odabranog mjeseca (MONTH view).</small>
        </div>

        <div class="field">
          <label>Napomena</label>
          <input id="expAddNote" type="text" placeholder="npr račun, popravka, ..." />
        </div>

      </div>

      <div class="modalFooter">
        <button id="btnSaveExpense" class="btn" type="button">Sačuvaj</button>
        <button id="btnCancelExpense" class="btn secondary" type="button">Otkaži</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/expenses.js"></script>
</body>

</html>
